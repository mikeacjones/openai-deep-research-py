[project]
name = "deep-research-python-refactor"
version = "0.1.0"
description = "Deployable deep research worker using OpenAI Responses API and Temporal"
authors = [{ name = "Temporal Technologies Inc", email = "sdk@temporal.io" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = ["temporalio>=1.15.0,<2", "openai>=1.40.0", "pydantic>=2.0.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
